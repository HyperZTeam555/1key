<!doctype html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/genizy/google-class@main/shredsauce/" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shred Sauce</title>
  <link rel="stylesheet" href="TemplateData/style.css" />
  <style>#loading-text{color:#fff;font-size:36px;font-family:cursive;text-align:center;margin-top:20px}</style>
</head>
<body>
  <div id="loading-text">LOADING...</div>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="540" tabindex="-1"></canvas>
    <div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
    <div id="unity-warning"></div>
  </div>
  <script>
    const loadingText = document.getElementById("loading-text");
    function getParts(file,start,end){ const p=[]; for(let i=start;i<=end;i++) p.push(`${file}.part${i}`); return p; }
    async function merge(parts){ const bufs = await Promise.all(parts.map(async p => await (await fetch(p)).arrayBuffer())); return URL.createObjectURL(new Blob(bufs)); }
    (async()=>{
      const [dataUrl, wasmUrl] = await Promise.all([
        merge(getParts("Build/b8baf304ab63b27d543288e594c9716f.data.gz",1,2)),
        merge(getParts("Build/150f9aa8e74e09da531ebfc4750c7402.wasm.gz",1,3)),
      ]);
      const loaderUrl = "Build/9edd899bc6b6e0bbc4f46ff33ca0bba6.loader.js";
      const cfg = {
        dataUrl,
        frameworkUrl: "Build/framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Shredsauce",
        productName: "Shredsauce",
        productVersion: "1.0",
      };
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(document.getElementById("unity-canvas"), cfg, (p) => {
          document.getElementById("unity-progress-bar-full").style.width = `${Math.round(p*100)}%`;
        }).then(() => {
          document.getElementById("unity-loading-bar").style.display = "none";
          loadingText.remove();
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>

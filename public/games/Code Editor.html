<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Editor</title>
  <style>
    :root {
      --bg: #eef1f4;
      --panel: #ffffff;
      --line: #d4d9df;
      --line-strong: #c2c8cf;
      --text: #1d232a;
      --muted: #5d6773;
      --btn: #f3f5f7;
      --btn-hover: #e6eaef;
      --btn-strong: #2b3440;
      --btn-strong-hover: #1f2732;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      padding: 10px;
      gap: 10px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-right: 8px;
    }

    button {
      border: 1px solid #bdbdbd;
      background: var(--btn);
      color: var(--text);
      padding: 7px 11px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    button:hover { background: var(--btn-hover); }
    button.active {
      background: #dde3ea;
      border-color: var(--line-strong);
    }

    button.primary {
      background: var(--btn-strong);
      border-color: var(--btn-strong);
      color: #fff;
    }

    button.primary:hover {
      background: var(--btn-strong-hover);
      border-color: var(--btn-strong-hover);
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .left, .right {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .editor-wrap {
      position: relative;
      min-height: 0;
    }

    .editor {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      resize: none;
      padding: 12px;
      font: 13px/1.45 Consolas, Menlo, Monaco, monospace;
      color: #111;
      background: #fcfdff;
      outline: none;
      display: none;
    }

    .editor.active { display: block; }

    .label {
      border-top: 1px solid var(--line);
      padding: 9px 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .preview {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .console {
      margin: 0;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      font: 13px/1.45 Consolas, Menlo, Monaco, monospace;
      border-top: 1px solid var(--line);
      background: #f7f9fb;
      color: #111;
      height: 200px;
    }

    .hidden { display: none; }

    @media (max-width: 980px) {
      .app {
        padding: 6px;
        gap: 6px;
      }

      .main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }

      .left {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .right {
        border-left: 0;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-css.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-beautify@1.15.1/js/lib/beautify-html.js"></script>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="tabs">
        <button id="tab-html" data-tab="html" class="active">HTML</button>
        <button id="tab-css" data-tab="css">CSS</button>
        <button id="tab-js" data-tab="js">JavaScript</button>
        <button id="tab-py" data-tab="py">Python</button>
      </div>

      <button id="run-web" class="primary">Run Web</button>
      <button id="run-py" class="primary">Run Python</button>
      <button id="beautify-current">Beautify Current</button>
      <button id="beautify-web">Beautify HTML/CSS/JS</button>
      <button id="fullscreen-preview">Fullscreen Preview</button>
      <button id="clear-console">Clear Console</button>
      <button id="reset-all">Reset</button>
    </div>

    <div class="main">
      <div class="left">
        <div class="editor-wrap">
          <textarea id="editor-html" class="editor active"></textarea>
          <textarea id="editor-css" class="editor"></textarea>
          <textarea id="editor-js" class="editor"></textarea>
          <textarea id="editor-py" class="editor"></textarea>
        </div>
        <div id="editor-label" class="label">Editing: HTML</div>
      </div>

      <div id="preview-pane" class="right">
        <iframe id="preview" class="preview" title="Preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
        <pre id="console" class="console"></pre>
      </div>
    </div>
  </div>

  <script>
    const storageKey = "simple-code-editor-v1";
    const state = {
      activeTab: "html",
      pyodide: null,
      pyReady: false,
      runningPython: false
    };

    const editors = {
      html: document.getElementById("editor-html"),
      css: document.getElementById("editor-css"),
      js: document.getElementById("editor-js"),
      py: document.getElementById("editor-py")
    };

    const preview = document.getElementById("preview");
    const previewPane = document.getElementById("preview-pane");
    const consoleEl = document.getElementById("console");
    const editorLabel = document.getElementById("editor-label");

    const defaultCode = {
      html: "<h1>Hello</h1>\n<p>Edit HTML, CSS, and JavaScript. Then click Run Web.</p>\n<button onclick=\"alert('Hi')\">Click</button>",
      css: "body {\n  font-family: Arial, sans-serif;\n  padding: 20px;\n}\n\nh1 {\n  margin-top: 0;\n}",
      js: "console.log('JavaScript loaded');",
      py: "print('Python is ready')\nfor i in range(3):\n    print('line', i + 1)"
    };

    function writeConsole(text) {
      consoleEl.textContent += text;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function setConsole(text) {
      consoleEl.textContent = text || "";
    }

    function setActiveTab(tab) {
      state.activeTab = tab;

      document.querySelectorAll(".editor").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".tabs button").forEach((btn) => btn.classList.remove("active"));

      editors[tab].classList.add("active");
      document.getElementById("tab-" + tab).classList.add("active");
      editorLabel.textContent = "Editing: " + ({
        html: "HTML",
        css: "CSS",
        js: "JavaScript",
        py: "Python"
      })[tab];
    }

    function getWebDocument() {
      const html = editors.html.value;
      const css = editors.css.value;
      const js = editors.js.value;

      return (
        "<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'>" +
        "<style>" + css + "</style></head><body>" +
        html +
        "<script>" + js.replace(/<\/script>/gi, "<\\/script>") + "<\/script>" +
        "</body></html>"
      );
    }

    function runWeb() {
      preview.srcdoc = getWebDocument();
      setConsole("Web preview updated.\n");
    }

    async function ensurePyodide() {
      if (state.pyReady) return state.pyodide;
      setConsole("Loading Python runtime...\n");
      state.pyodide = await loadPyodide();
      state.pyReady = true;
      writeConsole("Python runtime ready.\n");
      return state.pyodide;
    }

    async function runPython() {
      if (state.runningPython) return;
      state.runningPython = true;
      setConsole("");

      try {
        const pyodide = await ensurePyodide();
        const code = editors.py.value;
        pyodide.setStdout({
          batched: (msg) => {
            writeConsole(msg + "\n");
          }
        });
        pyodide.setStderr({
          batched: (msg) => {
            writeConsole(msg + "\n");
          }
        });

        await pyodide.runPythonAsync(code);
      } catch (err) {
        writeConsole(String(err) + "\n");
      } finally {
        state.runningPython = false;
      }
    }

    function beautifyCurrent() {
      const tab = state.activeTab;
      if (tab === "html") {
        editors.html.value = html_beautify(editors.html.value, { indent_size: 2 });
      } else if (tab === "css") {
        editors.css.value = css_beautify(editors.css.value, { indent_size: 2 });
      } else if (tab === "js") {
        editors.js.value = js_beautify(editors.js.value, { indent_size: 2 });
      } else if (tab === "py") {
        // Keep Python simple: normalize tabs to spaces.
        editors.py.value = editors.py.value.replace(/\t/g, "    ");
      }
      persist();
    }

    function beautifyWeb() {
      editors.html.value = html_beautify(editors.html.value, { indent_size: 2 });
      editors.css.value = css_beautify(editors.css.value, { indent_size: 2 });
      editors.js.value = js_beautify(editors.js.value, { indent_size: 2 });
      persist();
    }

    function resetAll() {
      editors.html.value = defaultCode.html;
      editors.css.value = defaultCode.css;
      editors.js.value = defaultCode.js;
      editors.py.value = defaultCode.py;
      setConsole("");
      runWeb();
      persist();
    }

    function persist() {
      const payload = {
        html: editors.html.value,
        css: editors.css.value,
        js: editors.js.value,
        py: editors.py.value
      };
      localStorage.setItem(storageKey, JSON.stringify(payload));
    }

    function loadSaved() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        editors.html.value = typeof saved.html === "string" ? saved.html : defaultCode.html;
        editors.css.value = typeof saved.css === "string" ? saved.css : defaultCode.css;
        editors.js.value = typeof saved.js === "string" ? saved.js : defaultCode.js;
        editors.py.value = typeof saved.py === "string" ? saved.py : defaultCode.py;
        return true;
      } catch {
        return false;
      }
    }

    document.querySelectorAll(".tabs button").forEach((btn) => {
      btn.addEventListener("click", () => setActiveTab(btn.dataset.tab));
    });

    document.getElementById("run-web").addEventListener("click", runWeb);
    document.getElementById("run-py").addEventListener("click", runPython);
    document.getElementById("beautify-current").addEventListener("click", beautifyCurrent);
    document.getElementById("beautify-web").addEventListener("click", beautifyWeb);
    document.getElementById("clear-console").addEventListener("click", () => setConsole(""));
    document.getElementById("reset-all").addEventListener("click", resetAll);

    document.getElementById("fullscreen-preview").addEventListener("click", async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await previewPane.requestFullscreen();
      }
    });

    Object.values(editors).forEach((editor) => {
      editor.addEventListener("input", persist);
      editor.addEventListener("keydown", (e) => {
        if (e.key === "Tab") {
          e.preventDefault();
          const start = editor.selectionStart;
          const end = editor.selectionEnd;
          editor.value = editor.value.slice(0, start) + "  " + editor.value.slice(end);
          editor.selectionStart = editor.selectionEnd = start + 2;
          persist();
        }
      });
    });

    if (!loadSaved()) {
      resetAll();
    } else {
      runWeb();
    }
  </script>
</body>
</html>
